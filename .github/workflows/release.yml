name: release

# A plain x.y.z tag builds static binaries and attaches them to a GitHub
# release, so machines without cargo (cloud sessions) can download ahok.
# Pull requests that touch this file run the build without releasing.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: ahok-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ahok-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/ahok
          [ -f "$bin" ] || bin="$bin.exe"
          mv "$bin" ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" ahok-*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --generate-notes
