[package]
name = "ahok"
version = "0.1.0"
edition = "2024"
description = "Stateless control plane for coding-agent harness hooks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arvinduh/ahok"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "deny"
single_component_path_imports = "allow"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
redundant_clone = "warn"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
globset = { version = "0.4.21", default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
