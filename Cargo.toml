[workspace]
members = ["crates/*"]
# Plain `cargo test` and `cargo clippy` cover every crate, not just the bin.
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/arvinduh/ahok"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "deny"
single_component_path_imports = "allow"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
missing_assert_message = "warn"
exit = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
missing_docs_in_private_items = "warn"
redundant_clone = "warn"

[workspace.dependencies]
axoupdater = { version = "0.10.2", default-features = false, features = [
  "github_releases",
] }
dispatch = { path = "crates/dispatch", package = "ahok-dispatch" }
doctor = { path = "crates/doctor", package = "ahok-doctor" }
event = { path = "crates/event", package = "ahok-event" }
harness = { path = "crates/harness", package = "ahok-harness" }
link = { path = "crates/link", package = "ahok-link" }
rules = { path = "crates/rules", package = "ahok-rules" }
semver = "1"
state = { path = "crates/state", package = "ahok-state" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time"] }

globset = { version = "0.4.21", default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"

[workspace.dependencies.clap]
version = "4.6.7"
default-features = false
features = ["std", "derive", "help", "usage", "error-context"]

[workspace.dependencies.toml]
version = "1.1.8"
default-features = false
features = ["parse", "serde"]

[package]
name = "ahok"
description = "Stateless control plane for coding-agent harness hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["update"]
update = ["dep:axoupdater", "dep:semver", "dep:tempfile", "dep:tokio"]

[dependencies]
axoupdater = { workspace = true, optional = true }
clap.workspace = true
dispatch.workspace = true
doctor.workspace = true
event.workspace = true
harness.workspace = true
link.workspace = true
rules.workspace = true
semver = { workspace = true, optional = true }
state.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }

# Config for 'dist' (cargo-dist): GitHub Releases are the only channel - no
# crates.io publish.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
install-path = ["~/.local/bin", "~/.cargo/bin"]
install-updater = false
source-tarball = false
# release.yml carries a local edit (bare x.y.z tag trigger)
allow-dirty = ["ci"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
