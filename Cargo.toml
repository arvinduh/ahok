[package]
name = "ahok"
version = "0.1.0"
edition = "2024"
description = "Stateless control plane for coding-agent harness hooks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arvinduh/ahok"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "deny"
single_component_path_imports = "allow"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
redundant_clone = "warn"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
