[workspace]
members = ["crates/*"]
# Plain `cargo test` and `cargo clippy` cover every crate, not just the bin.
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/arvinduh/ahok"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "deny"
single_component_path_imports = "allow"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
missing_assert_message = "warn"
exit = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
missing_docs_in_private_items = "warn"
redundant_clone = "warn"

[workspace.dependencies]
state = { path = "crates/state", package = "ahok-state" }
link = { path = "crates/link", package = "ahok-link" }
dispatch = { path = "crates/dispatch", package = "ahok-dispatch" }
event = { path = "crates/event", package = "ahok-event" }
globset = { version = "0.4.21", default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"

[workspace.dependencies.clap]
version = "4.6.7"
default-features = false
features = ["std", "derive", "help", "usage", "error-context"]

[workspace.dependencies.toml]
version = "1.1.8"
default-features = false
features = ["parse", "serde"]

[package]
name = "ahok"
description = "Stateless control plane for coding-agent harness hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
state.workspace = true
link.workspace = true
dispatch.workspace = true
event.workspace = true
clap.workspace = true
globset.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
